[project]
name = "omarchy-sendspin"
version = "0.1.0"
description = "Sendspin network outputs for the Omarchy audio menu"
requires-python = ">=3.13"
dependencies = ["aiosendspin[server]==10.3.0"]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1", "ruff>=0.14"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
